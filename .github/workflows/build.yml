name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v6
      - name: Reject deployment-specific values
        shell: bash
        run: |
          if git grep -n -E 'https://groupman-tcg-api\.[[:alnum:]-]+\.workers\.dev'; then
            echo 'Deployment-specific value found in tracked files.' >&2
            exit 1
          fi
      - name: Build and test
        run: ./gradlew clean build
